# Fóton — Render NÃO é mais usado em produção (ADR-0014/0016, docs/DECISIONS.md).
# A produção roda numa VM própria (Oracle Cloud) — ver BLUEPRINT.md §2/§5.
# Este arquivo só importa se algum serviço "foton-rig" ainda estiver conectado a este
# repo na Render — VERIFICAR e, se existir e não tiver uso, desligar (evita um segundo
# endpoint desatualizado respondendo pelo nome "Fóton").
# Deploy real: git push -> a VM se atualiza sozinha em ~2 min.
services:
  - type: web
    name: foton-rig
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r app/test_rig/requirements.txt
    startCommand: uvicorn rig:app --host 0.0.0.0 --port $PORT --app-dir app/test_rig
    healthCheckPath: /health
    autoDeploy: true
