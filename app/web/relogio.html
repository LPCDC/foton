<!doctype html>
<html lang="pt-BR" data-tema="dia" data-perfil="pro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Fóton | relógio de calibração</title>
<link rel="stylesheet" href="/ds/foton.css?v=5">
<!-- RELOGIO DE CALIBRACAO (ADR-0046). A camera tem relogio proprio, e o EXIF dela e so um
     proxy do disparo. Fotografar esta tela uma vez, antes do evento, mostra quanto o
     relogio da camera esta adiantado ou atrasado: o relatorio compara o EXIF dessa foto com
     a hora que aparece nela. A hora e a do SERVIDOR, medida por /agora, no fuso de Sao
     Paulo; a incerteza (metade da ida e volta) fica escrita embaixo. -->
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #FFFFFF; color: #000000; }
  main { text-align: center; padding: 24px 16px; }
  .hora { font: 700 clamp(3.4rem, 17vw, 10rem)/1 var(--f-ui); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .hora #decimos { font-size: .62em; }
  .data { font: 600 var(--t1)/1.3 var(--f-ui); margin-top: 12px; }
  .nota { margin: 24px auto 0; max-width: 34ch; color: #444; font-size: var(--t0); line-height: 1.45; }
  .erro { color: #C8102E; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="hora" aria-live="off"><span id="hms">--:--:--</span><span id="decimos">.-</span></div>
  <div class="data" id="data">sincronizando com o servidor</div>
  <p class="nota" id="nota">Fotografe esta tela com a câmera do evento, uma vez, antes de começar. Deixe os números nítidos.</p>
</main>
<script>
(function () {
  var off = null, rtt = null;                       // off = servidor - este aparelho, em ms
  var fmt = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit',
    minute: '2-digit', second: '2-digit', hour12: false });
  var fdia = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit',
    month: '2-digit', year: 'numeric' });

  function sincroniza() {
    var melhor = null, n = 0;
    function um() {
      var a = Date.now();
      fetch('/agora', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
        var b = Date.now(), r = b - a, o = j.t * 1000 - (a + b) / 2;
        if (!melhor || r < melhor.rtt) melhor = { rtt: r, off: o };   // a volta mais curta erra menos
      }).catch(function () {}).then(function () {
        if (++n < 5) return um();
        if (melhor) { off = melhor.off; rtt = melhor.rtt; }
        else document.getElementById('data').innerHTML = '<span class="erro">sem conexão com o servidor</span>';
      });
    }
    um();
  }

  function desenha() {
    if (off !== null) {
      var t = Date.now() + off;
      document.getElementById('hms').textContent = fmt.format(t);
      document.getElementById('decimos').textContent = '.' + Math.floor((t % 1000) / 100);
      document.getElementById('data').textContent = fdia.format(t) + ' · hora do servidor · ± ' + Math.round(rtt / 2) + ' ms';
    }
    requestAnimationFrame(desenha);
  }

  // tela acesa durante a calibracao, quando o aparelho deixa
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  sincroniza(); setInterval(sincroniza, 60000);
  requestAnimationFrame(desenha);
})();
</script>
</body>
</html>
