# Fóton — SITE DE MARCA (vitrine). Publica site/, nao o app.
# O APP de producao NAO fica aqui — fica na VM propria (app.foton.app.br /
# getfoton.duckdns.org). Este deploy e so a vitrine. Ver BLUEPRINT.md §2 e §9.
[build]
  publish = "site"
  command = ""

# SEM redirect coringa aqui, de proposito.
#
# Havia um `/* -> /index.html status=200`, herdado de quando este arquivo publicava
# `app/web` — o APP e uma SPA de verdade e precisava daquilo. O SITE DE MARCA e UMA
# pagina estatica so, e o coringa faz mal:
#   - qualquer endereco errado responde 200 com a home em vez de 404. Para o Google
#     isso e um numero infinito de URLs distintas servindo conteudo identico
#     (soft 404), que e exatamente o que se evita numa vitrine feita para ser achada.
#   - esconde link quebrado nosso: erro de digitacao num href nunca aparece.
# Sem o coringa, endereco inexistente devolve o 404 do Netlify, que e o certo.
